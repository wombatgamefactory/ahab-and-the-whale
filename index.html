  <!-- Consent banner (CookieYes, same site key as Firefly Festival) then Google tag (gtag.js, G-FNNQF917JJ).
       Same scripts and order as Firefly Festival, injected here so that localhost and 127.0.0.1
       (development and the automated tests) neither load the banner nor send hits to GA.
       window.gtag always exists and just queues on dataLayer, exactly as in the standard snippet. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FNNQF917JJ');
    (function () {
      var h = location.hostname;
      if (h === 'localhost' || h === '127.0.0.1' || h === '[::1]' || location.protocol === 'file:') return;
      function add(id, src, next) {
        var s = document.createElement('script');
        if (id) s.id = id;
        s.src = src;
        s.async = false;
        if (next) { s.onload = next; s.onerror = next; }
        document.head.appendChild(s);
      }
      add('cookieyes', 'https://cdn-cookieyes.com/client_data/b4b72588ac323168ef2bca929b5e5cd9/script.js', function () {
        add('', 'https://www.googletagmanager.com/gtag/js?id=G-FNNQF917JJ');
      });
    })();
  </script>
